name: Build Alex for Windows

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Upgrade pip
    run: python -m pip install --upgrade pip

  - name: Install dependencies
    shell: cmd
    run: |
      if exist requirements.txt (
        python -m pip install -r requirements.txt
      )
      python -m pip install pyinstaller

  - name: Build Alex.exe
    shell: cmd
    run: |
      python -m PyInstaller ^
        --name Alex ^
        --onefile ^
        --windowed ^
        --add-data "assets;assets" ^
        --hidden-import vosk ^
        --hidden-import sounddevice ^
        --hidden-import pyttsx3.drivers ^
        --hidden-import pyttsx3.drivers.sapi5 ^
        --hidden-import keyring.backends.Windows ^
        --hidden-import pyautogui ^
        main.py

  - name: Verify Alex.exe
    shell: cmd
    run: |
      if not exist "dist\Alex.exe" (
        echo ERROR: dist\Alex.exe was not created.
        echo.
        echo Contents of project directory:
        dir
        echo.
        echo Contents of dist:
        if exist dist dir dist
        exit /b 1
      )

      echo SUCCESS: Alex.exe exists.
      dir "dist\Alex.exe"

  - name: Upload Alex.exe
    uses: actions/upload-artifact@v4
    with:
      name: Alex-Windows
      path: dist/Alex.exe
      if-no-files-found: error
```
