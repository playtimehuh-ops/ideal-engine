name: Build Alex

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Alex
        run: |
          python -m PyInstaller --name Alex --onefile --windowed main.py

      - name: Verify Alex.exe
        shell: cmd
        run: |
          if not exist "dist\Alex.exe" (
            echo Alex.exe was not created.
            exit /b 1
          )
          echo Alex.exe was created successfully.
          dir "dist\Alex.exe"

      - name: Upload Alex.exe
        uses: actions/upload-artifact@v4
        with:
          name: Alex-Windows
          path: dist/Alex.exe
          if-no-files-found: error
