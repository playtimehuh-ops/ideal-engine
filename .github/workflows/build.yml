name: Build Alex.exe

# Builds on every push to main, on version tags (v1.0.0, v1.2.3, ...),
# and on demand via the "Run workflow" button in the Actions tab.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write   # only needed for the release step below

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Alex.exe
        shell: cmd
        run: build\build_exe.bat

      - name: Upload Alex.exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alex-exe
          path: dist/Alex.exe
          if-no-files-found: error

      # Only runs when you push a tag like "v1.0.0" - attaches Alex.exe
      # directly to a GitHub Release so it's easy to find and download.
      - name: Attach Alex.exe to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Alex.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
