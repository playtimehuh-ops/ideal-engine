```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    shell: cmd
    run: |
      python -m pip install --upgrade pip
      if exist requirements.txt python -m pip install -r requirements.txt
      python -m pip install pyinstaller

  - name: Build Alex
    shell: cmd
    run: |
      python -m PyInstaller --name Alex --onefile --windowed main.py

  - name: Check EXE
    shell: cmd
    run: |
      if not exist "dist\Alex.exe" (
        echo ERROR: Alex.exe was not created.
        exit /b 1
      )
      echo Alex.exe successfully created.
      dir "dist\Alex.exe"

  - name: Upload Alex
    uses: actions/upload-artifact@v4
    with:
      name: Alex-Windows
      path: dist/Alex.exe
      if-no-files-found: error

